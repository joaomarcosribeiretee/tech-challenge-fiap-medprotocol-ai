[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medprotocol-ai"
version = "0.1.0"
description = "Assistente educacional de apoio à consulta de protocolos hospitalares fictícios (DM2) — FIAP Tech Challenge Fase 3."
readme = "README.md"
requires-python = ">=3.11"
# Dependências de runtime entram apenas na etapa que as utiliza
# (LangChain, LangGraph, Chroma/FAISS, Transformers/PEFT, Streamlit).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
# Etapa 3 — recuperação de protocolos (embeddings locais, sem chave de API).
# sentence-transformers instala torch (CPU) e transformers como dependências.
rag = [
    "langchain-core>=1.7,<2",
    "langchain-huggingface>=1.2,<2",
    "sentence-transformers>=6.2,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
