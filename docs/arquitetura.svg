<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>MedProtocol AI — arquitetura</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="960" height="900" fill="#ffffff"/>

  <!-- Interface -->
  <rect x="60" y="20" width="480" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="300" y="44" text-anchor="middle" font-weight="700" fill="#1e1b4b">Interface Streamlit</text>
  <text x="300" y="63" text-anchor="middle" fill="#334155" font-size="12">pergunta · seletor ajustado/base · status · fontes · alertas · ID de auditoria</text>
  <line x1="300" y1="76" x2="300" y2="104" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LangGraph container -->
  <rect x="40" y="106" width="560" height="530" rx="10" fill="#f8fafc" stroke="#475569" stroke-dasharray="6 4"/>
  <text x="56" y="128" font-weight="700" fill="#0f172a">LangGraph — StateGraph (estado explícito, 7 nós)</text>

  <g fill="#dbeafe" stroke="#2563eb">
    <rect x="90" y="142" width="420" height="44" rx="6"/>
    <rect x="90" y="212" width="420" height="44" rx="6"/>
    <rect x="90" y="282" width="420" height="44" rx="6"/>
    <rect x="90" y="352" width="420" height="44" rx="6"/>
    <rect x="90" y="422" width="420" height="44" rx="6"/>
  </g>
  <rect x="90" y="492" width="420" height="44" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <rect x="90" y="562" width="420" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>

  <g fill="#0f172a">
    <text x="104" y="162" font-weight="600">1 · interpretar</text>
    <text x="104" y="178" font-size="12" fill="#334155">pergunta vazia? quantos pacientes (PAC-XXXX)? pedido de conduta?</text>
    <text x="104" y="232" font-weight="600">2 · consultar_paciente</text>
    <text x="104" y="248" font-size="12" fill="#334155">resumo do paciente, histórico de exames, verificações pendentes</text>
    <text x="104" y="302" font-weight="600">3 · recuperar_protocolos</text>
    <text x="104" y="318" font-size="12" fill="#334155">k = 4 trechos por similaridade, com score e status de confiança</text>
    <text x="104" y="372" font-weight="600">4 · aplicar_politica</text>
    <text x="104" y="388" font-size="12" fill="#334155">política de seções v1 (regras) + mensagens do prompt v3</text>
    <text x="104" y="442" font-weight="600">5 · gerar_resposta</text>
    <text x="104" y="458" font-size="12" fill="#334155">decodificação gulosa, até 512 tokens</text>
    <text x="104" y="512" font-weight="600">6 · validar_resposta</text>
    <text x="104" y="528" font-size="12" fill="#334155">regras determinísticas → alertas, retenção e status</text>
    <text x="104" y="582" font-weight="600">7 · registrar_auditoria</text>
    <text x="104" y="598" font-size="12" fill="#334155">evento JSONL (hashes, fontes, alertas, status, tempos)</text>
  </g>

  <g stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="300" y1="186" x2="300" y2="210"/>
    <line x1="300" y1="256" x2="300" y2="280"/>
    <line x1="300" y1="326" x2="300" y2="350"/>
    <line x1="300" y1="396" x2="300" y2="420"/>
    <line x1="300" y1="466" x2="300" y2="490"/>
    <line x1="300" y1="536" x2="300" y2="560"/>
  </g>
  <!-- sem paciente: 1 -> 3 -->
  <path d="M90,170 C62,190 62,290 88,302" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="100" y="203" font-size="11" fill="#475569">sem paciente: 1 → 3</text>

  <!-- atalhos para auditoria -->
  <g stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3" fill="none">
    <line x1="510" y1="164" x2="560" y2="164"/>
    <line x1="510" y1="234" x2="560" y2="234"/>
    <line x1="510" y1="374" x2="560" y2="374"/>
    <line x1="510" y1="444" x2="560" y2="444"/>
    <path d="M560,164 L560,584 L512,584" marker-end="url(#arrowg)"/>
  </g>
  <text x="576" y="236" font-size="11" fill="#64748b" transform="rotate(90 576 236)">atalhos sem LLM → auditoria</text>
  <text x="312" y="626" font-size="10" fill="#64748b">atalhos: erro · paciente inexistente · sem evidência · falha do LLM</text>

  <!-- Recursos externos ao grafo -->
  <g stroke="#475569">
    <rect x="640" y="200" width="290" height="68" rx="8" fill="#f1f5f9"/>
    <rect x="640" y="280" width="290" height="80" rx="8" fill="#f1f5f9"/>
    <rect x="640" y="410" width="290" height="68" rx="8" fill="#fef9c3"/>
    <rect x="640" y="556" width="290" height="56" rx="8" fill="#f1f5f9"/>
  </g>
  <text x="654" y="222" font-weight="700" fill="#0f172a">SQLite · LangChain Runnable</text>
  <text x="654" y="240" font-size="12" fill="#334155">16 pacientes, 16 consultas, 88 exames</text>
  <text x="654" y="256" font-size="12" fill="#334155">sintéticos · somente leitura · medprotocol.db</text>

  <text x="654" y="302" font-weight="700" fill="#0f172a">LangChain RAG</text>
  <text x="654" y="320" font-size="12" fill="#334155">InMemoryVectorStore + multilingual-e5-small</text>
  <text x="654" y="336" font-size="12" fill="#334155">3 protocolos simulados → 20 trechos</text>
  <text x="654" y="352" font-size="12" fill="#334155">referência PROTOCOLO#SEÇÃO (fonte)</text>

  <text x="654" y="432" font-weight="700" fill="#0f172a">Qwen2.5-1.5B + LoRA · LangChain</text>
  <text x="654" y="450" font-size="12" fill="#334155">BaseChatModel (LCEL) · GPU bf16; a variante</text>
  <text x="654" y="466" font-size="12" fill="#334155">"base" só desliga o adaptador</text>

  <text x="654" y="578" font-weight="700" fill="#0f172a">Auditoria</text>
  <text x="654" y="596" font-size="12" fill="#334155">logs/audit.jsonl · sem texto de pergunta/resposta</text>

  <g stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)">
    <line x1="512" y1="234" x2="638" y2="234"/>
    <line x1="512" y1="304" x2="638" y2="314"/>
    <line x1="512" y1="444" x2="638" y2="444"/>
  </g>
  <line x1="512" y1="590" x2="638" y2="584" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Resposta -->
  <line x1="300" y1="606" x2="300" y2="664" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="60" y="666" width="480" height="64" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="300" y="690" text-anchor="middle" font-weight="700" fill="#1e1b4b">Resposta estruturada</text>
  <text x="300" y="708" text-anchor="middle" font-size="12" fill="#334155">status: respondido · revisao_humana · evidencia_insuficiente · erro</text>
  <text x="300" y="723" text-anchor="middle" font-size="12" fill="#334155">resposta (ou mensagem segura se retida) · fontes · alertas · audit_id</text>
  <path d="M60,698 C8,698 8,48 58,48" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Fine-tuning offline -->
  <rect x="40" y="760" width="890" height="120" rx="10" fill="#fffbeb" stroke="#ca8a04" stroke-dasharray="6 4"/>
  <text x="56" y="782" font-weight="700" fill="#713f12">Fine-tuning (offline, Etapa 4) — produz o adaptador usado no nó 5</text>
  <g font-size="12" fill="#334155">
    <rect x="56" y="796" width="190" height="66" rx="6" fill="#ffffff" stroke="#ca8a04"/>
    <text x="66" y="816">Dataset sintético</text>
    <text x="66" y="832">61 perguntas/respostas</text>
    <text x="66" y="848">(qa_eval reservado)</text>
    <rect x="276" y="796" width="200" height="66" rx="6" fill="#ffffff" stroke="#ca8a04"/>
    <text x="286" y="816">SFT com o mesmo contexto</text>
    <text x="286" y="832">RAG + SQLite + política v1</text>
    <text x="286" y="848">split 48 treino / 13 validação</text>
    <rect x="506" y="796" width="200" height="66" rx="6" fill="#ffffff" stroke="#ca8a04"/>
    <text x="516" y="816">LoRA r=16, 3 épocas</text>
    <text x="516" y="832">RTX 4070 · 3,6 min · bf16</text>
    <text x="516" y="848">perda val. 1,30 → 0,88</text>
    <rect x="736" y="796" width="180" height="66" rx="6" fill="#ffffff" stroke="#ca8a04"/>
    <text x="746" y="816">Adaptador (71 MB)</text>
    <text x="746" y="832">models/adapters/…</text>
    <text x="746" y="848">não versionado</text>
  </g>
  <g stroke="#ca8a04" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="246" y1="829" x2="274" y2="829"/>
    <line x1="476" y1="829" x2="504" y2="829"/>
    <line x1="706" y1="829" x2="734" y2="829"/>
  </g>
  <path d="M826,796 L826,480" fill="none" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
</svg>
